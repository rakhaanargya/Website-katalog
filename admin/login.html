<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login Admin - Chococanaa</title>

    <link rel="stylesheet" href="admin.css">

</head>



<body>

    

    <main class="login-container">

        <div class="login-card">

            <div class="login-logo">
                Chococanaa
            </div>

            <h1>
                Login Admin
            </h1>

            <p class="login-subtitle">
                Masuk untuk mengelola produk
            </p>


            <form id="formLogin">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        required
                    >

                </div>


                <p
                    id="pesanLogin"
                    class="pesan-login"
                ></p>


                <button
                    type="submit"
                    class="btn-login"
                >
                    Login
                </button>

            </form>


            <a
                href="../index.html"
                class="kembali-website"
            >
                ← Kembali ke Website
            </a>

        </div>

    </main>


    <script src="login.js"></script>

</body>

</html>
